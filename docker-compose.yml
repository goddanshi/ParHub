services:
  mysql:
    image: mysql:8.0
    container_name: parhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-parhub}
      MYSQL_USER: ${DB_USER:-parhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-parhub123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: parhub_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      PMA_ABSOLUTE_URI: https://parhub-shop.ru/pma/
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parhub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-parhub}
      DB_USER: ${DB_USER:-parhub}
      DB_PASSWORD: ${DB_PASSWORD:-parhub123}
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin123}
      EXPORT_API_KEY: ${EXPORT_API_KEY:-}
      MOYSKLAD_TOKEN: ${MOYSKLAD_TOKEN:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-1440}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      REQUIRED_CHANNEL: ${REQUIRED_CHANNEL:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      APP_URL: ${APP_URL:-https://parhub-shop.ru}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parhub_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mysql_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
